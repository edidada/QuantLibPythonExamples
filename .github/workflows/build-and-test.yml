name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build QuantLib wrapper and run examples & testsuite
    # ubuntu-22.04 ships exactly the stack described in the README:
    # gcc/g++ 11, swig 4.0.2, python 3.10, boost 1.74
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      QL_VERSION: '1.27'
      QL_TARBALL_URL: >-
        https://github.com/lballabio/QuantLib/archive/refs/tags/QuantLib-v1.27.tar.gz
      QL_SRC_DIR: '/home/runner/ql-src'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libtool-bin swig libboost-dev \
            autoconf automake libtool \
            python3-dev python3-setuptools python3-numpy \
            python3-scipy python3-prettytable python3-seaborn

      # Note: tarballs from tag 'QuantLib-v1.27' unpack to 'QuantLib-QuantLib-v1.27/'
      # (GitHub prefixes <repo>-<tag>), so all steps below work with $QL_SRC_DIR
      # directly via --strip-components=1. Old caches keyed with a nested layout
      # are not compatible; delete cache 'ql-cpp-1.27-Linux-X64' if present.

      # ---- QuantLib (C++ library) -----------------------------------
      # Cache the configured + compiled source tree so that repeated runs
      # only re-run `make install`.
      - name: Cache QuantLib C++ build tree
        id: cache-ql-cpp
        uses: actions/cache@v4
        with:
          path: /home/runner/ql-src
          key: ql-cpp-${{ env.QL_VERSION }}-intraday-${{ runner.os }}-${{ runner.arch }}
          # Save even when a later step (SWIG/examples/testsuite) fails: the
          # compiled build tree is complete and reusable, so caching it makes
          # each debugging iteration skip the ~15 min C++ compilation.
          save-always: true

      - name: Build and install QuantLib C++ library
        if: steps.cache-ql-cpp.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$QL_SRC_DIR"
          curl -fsSL "$QL_TARBALL_URL" -o /tmp/quantlib.tar.gz
          # GitHub archive top dir is '<repo>-<tag>' = 'QuantLib-QuantLib-v1.27',
          # so strip it and unpack the source directly into $QL_SRC_DIR.
          tar -xzf /tmp/quantlib.tar.gz -C "$QL_SRC_DIR" --strip-components=1
          cd "$QL_SRC_DIR"
          # GitHub archive tarballs are git snapshots: no generated 'configure'
          # is committed, only configure.ac + autogen.sh. Generate it first.
          ./autogen.sh
          # --enable-intraday defines QL_HIGH_RESOLUTION_DATE, which guards the
          # intraday Date API (hours/seconds/fractionOfDay/localDateTime...) that
          # the reconstructed SWIG interfaces (ql/date.i) bind unconditionally.
          # Without it those members are #ifdef'd out and ql_wrap.cpp won't compile.
          ./configure --prefix=/usr --disable-static --enable-intraday
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Install QuantLib C++ library from cache
        if: steps.cache-ql-cpp.outputs.cache-hit == 'true'
        run: |
          set -euxo pipefail
          cd "$QL_SRC_DIR"
          sudo make install
          sudo ldconfig

      # ---- QuantLib python wrapper -----------------------------------
      # Cache the installed package (~/.local). Invalidated automatically
      # whenever any SWIG interface file / setup.py changes.
      - name: Cache installed QuantLib python package
        id: cache-ql-py
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/lib/python3.10/site-packages/QuantLib*
          key: ql-py-${{ runner.os }}-py310-${{ env.QL_VERSION }}-${{ hashFiles('SWIGpy/**') }}

      - name: Generate SWIG wrapper and install python package
        if: steps.cache-ql-py.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd SWIGpy
          swig -w509 -c++ -python \
            -outdir QuantLib \
            -o QuantLib/ql_wrap.cpp \
            quantlib.i
          CFLAGS='-O2 -g0' python3 setup.py install --user

      # ---- Verification ----------------------------------------------
      - name: Smoke test
        run: |
          python3 -c "import QuantLib; print('QuantLib version:', QuantLib.__version__)"

      - name: Run qlExamples and qlexExamples
        run: |
          for f in qlExamples/*.py qlexExamples/*.py; do
            echo "===== $f ====="
            python3 "$f"
          done

      - name: Run full test suite (testsuite/*)
        run: |
          python3 main.py
