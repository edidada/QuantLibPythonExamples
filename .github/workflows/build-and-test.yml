name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Shared QuantLib source-build parameters (read by jobs 1 and 2).
env:
  QL_VERSION: '1.27'
  QL_TARBALL_URL: >-
    https://github.com/lballabio/QuantLib/archive/refs/tags/QuantLib-v1.27.tar.gz
  QL_SRC_DIR: '/home/runner/ql-src'

jobs:
  # ===================================================================
  # Job 1 — compile the QuantLib C++ library and cache the build tree.
  # This job has no dependency on the (still-evolving) example scripts,
  # so it turns GREEN on its own and the ~15 min compilation is saved to
  # the cache. Later workflow edits to examples never re-trigger it.
  # ===================================================================
  quantlib-cpp:
    name: Build QuantLib C++ library (cache warm)
    # ubuntu-22.04 ships exactly the stack described in the README:
    # gcc/g++ 11, swig 4.0.2, python 3.10, boost 1.74
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libtool-bin libboost-dev \
            autoconf automake libtool

      - name: Cache QuantLib C++ build tree
        id: cache-ql-cpp
        uses: actions/cache@v4
        with:
          path: ${{ env.QL_SRC_DIR }}
          key: ql-cpp-${{ env.QL_VERSION }}-intraday-${{ runner.os }}-${{ runner.arch }}

      - name: Generate configure and compile QuantLib (cache miss only)
        if: steps.cache-ql-cpp.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$QL_SRC_DIR"
          curl -fsSL "$QL_TARBALL_URL" -o /tmp/quantlib.tar.gz
          # GitHub archive top dir is '<repo>-<tag>' = 'QuantLib-QuantLib-v1.27',
          # so strip it and unpack the source directly into $QL_SRC_DIR.
          tar -xzf /tmp/quantlib.tar.gz -C "$QL_SRC_DIR" --strip-components=1
          cd "$QL_SRC_DIR"
          # GitHub archive tarballs are git snapshots: no generated 'configure'
          # is committed, only configure.ac + autogen.sh. Generate it first.
          ./autogen.sh
          # --enable-intraday defines QL_HIGH_RESOLUTION_DATE, which guards the
          # intraday Date API (hours/seconds/fractionOfDay/localDateTime...) that
          # the reconstructed SWIG interfaces (ql/date.i) bind unconditionally.
          ./configure --prefix=/usr --disable-static --enable-intraday
          make -j"$(nproc)"

  # ===================================================================
  # Job 2 — install the cached C++ lib, generate + compile the SWIG
  # python wrapper and cache it. Also turns GREEN on its own (it does not
  # run the example scripts), so the ~10 min ql_wrap.cpp compilation is
  # cached. Editing only qlExamples/** never invalidates this wrapper
  # cache (its key hashes SWIGpy/** only).
  # ===================================================================
  quantlib-wrapper:
    name: Build & install SWIG python wrapper
    needs: quantlib-cpp
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libtool-bin swig libboost-dev \
            autoconf automake libtool \
            python3-dev python3-setuptools python3-numpy \
            python3-scipy python3-prettytable python3-seaborn

      - name: Restore QuantLib C++ build tree
        uses: actions/cache@v4
        with:
          path: ${{ env.QL_SRC_DIR }}
          key: ql-cpp-${{ env.QL_VERSION }}-intraday-${{ runner.os }}-${{ runner.arch }}

      - name: Install QuantLib C++ library from cached tree
        run: |
          set -euxo pipefail
          cd "$QL_SRC_DIR"
          sudo make install
          sudo ldconfig

      - name: Cache installed QuantLib python package
        id: cache-ql-py
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/lib/python3.10/site-packages/QuantLib*
          key: ql-py-${{ runner.os }}-py310-${{ env.QL_VERSION }}-${{ hashFiles('SWIGpy/**') }}

      - name: Generate SWIG wrapper and install python package
        if: steps.cache-ql-py.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd SWIGpy
          swig -w509 -c++ -python \
            -outdir QuantLib \
            -o QuantLib/ql_wrap.cpp \
            quantlib.i
          CFLAGS='-O2 -g0' python3 setup.py install --user

      - name: Smoke test
        run: |
          python3 -c "import QuantLib; print('QuantLib version:', QuantLib.__version__)"

  # ===================================================================
  # Job 3 — the actual test/oracle job. It only RESTORES the two warm
  # caches and RUNS everything, tolerating individual failures so a single
  # pass enumerates every broken example/test module at once (the porting
  # inventory). Iterating on example fixes costs only a few minutes here.
  # ===================================================================
  examples-and-tests:
    name: Run examples and testsuite (collect full inventory)
    needs: quantlib-wrapper
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool-bin libboost-dev \
            python3-dev python3-setuptools python3-numpy \
            python3-scipy python3-prettytable python3-seaborn

      - name: Restore QuantLib C++ build tree
        uses: actions/cache@v4
        with:
          path: ${{ env.QL_SRC_DIR }}
          key: ql-cpp-${{ env.QL_VERSION }}-intraday-${{ runner.os }}-${{ runner.arch }}

      - name: Install QuantLib C++ library (for runtime .so)
        run: |
          set -euxo pipefail
          cd "$QL_SRC_DIR"
          sudo make install
          sudo ldconfig

      - name: Restore installed QuantLib python package
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/lib/python3.10/site-packages/QuantLib*
          key: ql-py-${{ runner.os }}-py310-${{ env.QL_VERSION }}-${{ hashFiles('SWIGpy/**') }}

      - name: Smoke test
        run: |
          python3 -c "import QuantLib; print('QuantLib version:', QuantLib.__version__)"

      - name: Run qlExamples and qlexExamples (continue-on-failure)
        run: |
          set +e
          mkdir -p /tmp/ql-report
          : > /tmp/ql-report/failures.txt
          : > /tmp/ql-report/examples.txt
          for f in qlExamples/*.py qlexExamples/*.py; do
            echo "===== $f ====="
            if python3 "$f"; then
              echo "PASS $f" | tee -a /tmp/ql-report/examples.txt
            else
              echo "FAIL $f" | tee -a /tmp/ql-report/examples.txt
              echo "EXAMPLE $f" >> /tmp/ql-report/failures.txt
            fi
          done

      - name: Run each testsuite module (continue-on-failure)
        run: |
          set +e
          mkdir -p /tmp/ql-report
          : > /tmp/ql-report/testsuite.txt
          shopt -s nullglob
          for m in testsuite/*.py; do
            b=$(basename "$m" .py)
            [ "$b" = "__init__" ] && continue
            mod="testsuite.$b"
            echo "===== $mod ====="
            # 300s cap per module so one hanging test cannot stall the run
            if timeout 300 python3 -m unittest "$mod" ; then
              echo "PASS $mod" >> /tmp/ql-report/testsuite.txt
            else
              rc=$?
              echo "FAIL($rc) $mod" >> /tmp/ql-report/testsuite.txt
              # rc 124 == timeout(1) kill
              echo "TEST $mod (rc=$rc)" >> /tmp/ql-report/failures.txt
            fi
          done

      - name: Summary and gate
        run: |
          echo "==================== EXAMPLES ===================="
          column -t /tmp/ql-report/examples.txt 2>/dev/null || cat /tmp/ql-report/examples.txt
          echo
          echo "==================== TESTSUITE ==================="
          awk '{print}' /tmp/ql-report/testsuite.txt \
            | sort | column -t 2>/dev/null || cat /tmp/ql-report/testsuite.txt
          echo
          total_t=$(grep -c . /tmp/ql-report/testsuite.txt || true)
          fail_t=$(grep -c '^FAIL' /tmp/ql-report/testsuite.txt || true)
          total_e=$(grep -c . /tmp/ql-report/examples.txt || true)
          fail_e=$(grep -c '^FAIL' /tmp/ql-report/examples.txt || true)
          echo "examples: ${fail_e}/${total_e} failing | testsuite: ${fail_t}/${total_t} failing"
          if [ -s /tmp/ql-report/failures.txt ]; then
            echo
            echo "################ FULL FAILURE INVENTORY ################"
            cat /tmp/ql-report/failures.txt
            # Also emit to the run summary page.
            {
              echo "### Full failure inventory"
              echo '```'
              cat /tmp/ql-report/failures.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ALL GREEN"
